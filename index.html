<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Qué hacemos hoy?</title>
<meta name="description" content="Listas de actividades, lugares para comer y para visitar, y planes para el día.">
<meta name="theme-color" content="#2F7D5B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap" id="app">
  <!-- Cargando -->
  <section id="vLoading" class="center">
    <div class="logo" aria-hidden="true"></div>
    <p class="muted">Cargando…</p>
  </section>

  <!-- Login -->
  <section id="vLogin" class="center" hidden>
    <div class="logo" aria-hidden="true"></div>
    <h1>¿Qué hacemos hoy?</h1>
    <p class="muted">Nuestra lista de actividades, lugares para comer y para visitar.</p>
    <button class="btn primary big" id="loginBtn" type="button">Entrar con Google</button>
    <p class="err" id="loginErr" hidden></p>
  </section>

  <!-- Sin grupo -->
  <section id="vGroup" hidden>
    <h1>Hola<span id="helloName"></span></h1>
    <p class="muted">Para empezar, creá una lista (para compartir o solo para vos) o sumate a una con el código que te pasen.</p>
    <div class="card">
      <h2>Crear una lista</h2>
      <label>Nombre de la lista<input id="gName" type="text" maxlength="40" value="Nuestra lista"></label>
      <div class="pills" role="group" aria-label="Quién la ve">
        <button type="button" class="pill" data-gpriv="1" aria-pressed="true">🔒 Mi lista</button>
        <button type="button" class="pill" data-gpriv="0" aria-pressed="false">👥 Compartida</button>
      </div>
      <button class="btn primary" id="gCreate" type="button">Crear lista</button>
    </div>
    <div class="card">
      <h2>Tengo un código</h2>
      <label>Código de invitación<input id="gCode" type="text" maxlength="8" autocapitalize="characters" autocomplete="off" placeholder="Ej.: K7M2QX" style="text-transform:uppercase;letter-spacing:.15em"></label>
      <button class="btn ghost" id="gJoin" type="button">Unirme</button>
    </div>
    <p class="err" id="gErr" hidden></p>
    <button class="linkbtn" id="gLogout" type="button">Cerrar sesión</button>
  </section>

  <!-- Principal -->
  <section id="vMain" hidden>
    <header>
      <div style="min-width:0">
        <h1><button type="button" class="listsw" id="listSw" aria-label="Cambiar de lista"><span id="listName"></span><svg class="caret" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></h1>
        <div class="sub" id="summary">Cargando…</div>
      </div>
      <button class="who" id="menuBtn" type="button" aria-label="Lista y ajustes"></button>
    </header>

    <div class="banner" id="banner" hidden></div>

    <button class="hero" id="heroBtn" type="button">
      <div><b>¿Qué hacemos hoy?</b><span>Elegimos uno al azar de lo pendiente</span></div>
      <div class="dice" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
      </div>
    </button>

    <button class="disc" id="discBtn" type="button">
      <span aria-hidden="true" class="disc-ic">✨</span>
      <div><b>Para descubrir</b><span id="discSub">Propuestas de esta semana en Buenos Aires</span></div>
      <span aria-hidden="true" class="disc-go">›</span>
    </button>

    <div class="seg" role="tablist">
      <button type="button" data-view="pend" aria-pressed="true">Pendientes</button>
      <button type="button" data-view="done" aria-pressed="false">Hechos</button>
      <button type="button" data-view="zonas" aria-pressed="false">Barrios</button>
      <button type="button" data-view="mapa" aria-pressed="false">Mapa</button>
      <button type="button" data-view="planes" aria-pressed="false">Planes</button>
      <button type="button" data-view="calendario" aria-pressed="false">Calendario</button>
    </div>

    <div class="tabs" role="tablist" id="tabs"></div>

    <div class="tools" id="tools">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar en esta lista" aria-label="Buscar" autocomplete="off">
      </div>
      <div class="filters" id="filters"></div>
      <div class="resnote" id="resnote" hidden></div>
    </div>

    <ul class="list" id="list"></ul>
    <div class="zgrid" id="zonas" hidden></div>

    <div id="planes" class="plans" hidden></div>
    <div id="cal" class="plans" hidden></div>

    <div id="mapWrap" hidden>
      <div class="pills" id="mapFilters"></div>
      <div id="map" class="map"></div>
      <div class="resnote" id="mapNote"></div>
    </div>

    <footer>
      <details>
        <summary>¿Qué hacemos hoy? · versión <span id="ver"></span></summary>
        <ul id="changelog"></ul>
      </details>
    </footer>
  </section>
</div>

<button class="fab" id="addBtn" type="button" hidden><span aria-hidden="true" style="font-size:1.3rem;line-height:1">+</span> <span id="addLbl">Agregar</span></button>
<div class="toast" id="toast" role="status" hidden></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="app.js"></script>
</body>
</html>
