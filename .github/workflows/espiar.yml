name: Espiar páginas (diagnóstico)
on:
  push:
    paths: [".github/workflows/espiar.yml", "tools/espiar.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  espiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tools/espiar.mjs
      - run: |
          git config user.name "robot-descubrir"
          git config user.email "actions@users.noreply.github.com"
          git add data/_debug
          git commit -m "diagnóstico de páginas [skip ci]" || echo "sin cambios"
          git push
