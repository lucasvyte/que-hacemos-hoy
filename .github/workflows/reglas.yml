name: Reglas de Firebase (publicar)
# Publica firestore.rules en Firebase cada vez que cambia en main (o a mano desde Actions → Run workflow).
# Necesita el secreto FIREBASE_SA: la clave JSON de una cuenta de servicio con los roles
# "Administrador de reglas de Firebase" y "Consumidor de Service Usage". Sin el secreto, no hace nada.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["firestore.rules", ".github/workflows/reglas.yml"]
permissions:
  contents: read
concurrency: { group: reglas, cancel-in-progress: false }
jobs:
  reglas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_SA: ${{ secrets.FIREBASE_SA != '' }}
    steps:
      - name: Falta el secreto
        if: env.HAS_SA != 'true'
        run: echo "::warning::Falta el secreto FIREBASE_SA; las reglas no se publicaron."
      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true'
      - uses: google-github-actions/auth@v2
        if: env.HAS_SA == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SA }}
      - uses: actions/setup-node@v4
        if: env.HAS_SA == 'true'
        with: { node-version: 22 }
      - name: Publicar reglas
        if: env.HAS_SA == 'true'
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project que-hacemos-hoy-59b81 --non-interactive
